name: Code Quality

on:
    push:
        branches:
            - '**'
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: code-quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Typecheck and test
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check committed whitespace
              run: |
                  set -euo pipefail
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      git diff --check "origin/${{ github.base_ref }}...HEAD"
                  else
                      before="${{ github.event.before }}"
                      if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
                          before="$(git rev-list --max-parents=0 HEAD)"
                      fi
                      git diff --check "$before" HEAD
                  fi

            - name: Typecheck
              run: bun typecheck

            - name: Create integration test env
              run: |
                  {
                      echo "HAPI_HOME=~/.hapi-dev-test"
                      echo "HAPI_API_URL=http://localhost:3006"
                      echo "CLI_API_TOKEN=${CLI_API_TOKEN:-dev-test-token}"
                      echo "HAPI_DAEMON_HTTP_TIMEOUT=60000"
                      echo "HAPI_DAEMON_HEARTBEAT_INTERVAL=30000"
                  } > cli/.env.integration-test

            - name: Test
              run: bun run test
