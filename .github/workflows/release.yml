name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to create or reuse, for example v1.1.0 or v1.1.0-260813'
                required: true
                type: string

permissions:
    contents: write

jobs:
    prepare:
        name: Prepare release tag
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            tag: ${{ steps.meta.outputs.tag }}
            version: ${{ steps.meta.outputs.version }}
            commit: ${{ steps.meta.outputs.commit }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve release tag
              id: meta
              run: |
                  set -euo pipefail
                  tag="${{ github.event.inputs.tag || github.ref_name }}"
                  if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
                      echo "Release tag must look like v1.1.0 or v1.1.0-260813, got: $tag" >&2
                      exit 1
                  fi
                  version="${BASH_REMATCH[1]}"

                  check_versions() {
                      local cli_version
                      local app_version
                      cli_version="$(awk -F\" '/"version":/ { print $4; exit }' cli/package.json)"
                      app_version="$(sed -n "s/^export const APP_VERSION = '\([^']*\)'.*/\1/p" shared/src/buildInfo.ts)"

                      if [[ "$cli_version" != "$version" ]]; then
                          echo "cli/package.json version ($cli_version) must match release tag version ($version)." >&2
                          exit 1
                      fi

                      if [[ "$app_version" != "$version" ]]; then
                          echo "shared/src/buildInfo.ts APP_VERSION ($app_version) must match release tag version ($version)." >&2
                          exit 1
                      fi
                  }

                  git fetch --force --tags origin

                  if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
                      echo "Using existing release tag: $tag"
                      git checkout --detach "refs/tags/$tag"
                      check_versions
                  else
                      if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
                          echo "Release tag $tag was not found." >&2
                          exit 1
                      fi
                      check_versions
                      echo "Creating release tag $tag at $(git rev-parse --short HEAD)"
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git tag -a "$tag" -m "Release $tag"
                      git push origin "refs/tags/$tag"
                  fi

                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    checks:
        name: Quality checks
        needs: prepare
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout release commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare.outputs.commit }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun typecheck

            - name: Create integration test env
              run: |
                  {
                      echo "HAPI_HOME=~/.hapi-dev-test"
                      echo "HAPI_API_URL=http://localhost:3006"
                      echo "CLI_API_TOKEN=${CLI_API_TOKEN:-dev-test-token}"
                      echo "HAPI_DAEMON_HTTP_TIMEOUT=60000"
                      echo "HAPI_DAEMON_HEARTBEAT_INTERVAL=30000"
                  } > cli/.env.integration-test

            - name: Test
              run: bun run test

    web-assets:
        name: Build embedded web assets
        needs: prepare
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout release commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare.outputs.commit }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build web assets
              run: |
                  bun run build:web
                  cd hub && bun run generate:embedded-web-assets

            - name: Pack embedded web assets
              run: |
                  tar -czf web-embedded-assets.tar.gz web/dist hub/src/web/embeddedAssets.generated.ts

            - name: Upload embedded web assets
              uses: actions/upload-artifact@v4
              with:
                  name: web-embedded-assets-${{ needs.prepare.outputs.tag }}
                  path: web-embedded-assets.tar.gz
                  if-no-files-found: error
                  retention-days: 7

    build:
        name: Build ${{ matrix.platform }}
        needs:
            - prepare
            - web-assets
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: darwin-arm64
                      target: bun-darwin-arm64
                      archive: tar.gz
                    - platform: darwin-amd64
                      target: bun-darwin-x64
                      archive: tar.gz
                    - platform: linux-arm64
                      target: bun-linux-arm64
                      archive: tar.gz
                    - platform: linux-amd64
                      target: bun-linux-x64-baseline
                      archive: tar.gz
                    - platform: windows-amd64
                      target: bun-windows-x64
                      archive: zip
        steps:
            - name: Checkout release commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare.outputs.commit }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Download tool archives
              run: bun run download:tunwg

            - name: Download embedded web assets
              uses: actions/download-artifact@v4
              with:
                  name: web-embedded-assets-${{ needs.prepare.outputs.tag }}
                  path: .

            - name: Restore embedded web assets
              run: |
                  tar -xzf web-embedded-assets.tar.gz
                  test -f hub/src/web/embeddedAssets.generated.ts
                  test -f web/dist/index.html

            - name: Build ${{ matrix.platform }} executables
              run: |
                  cd cli
                  bun run scripts/build-executable.ts --server-and-client --target "${{ matrix.target }}"

            - name: Verify client version output
              if: ${{ matrix.platform == 'linux-amd64' }}
              run: |
                  set -euo pipefail
                  output="$(cli/dist-exe/${{ matrix.target }}/hapi --version)"
                  echo "$output"
                  if [[ "$output" != *"${{ needs.prepare.outputs.version }}"* ]]; then
                      echo "hapi --version output must include ${{ needs.prepare.outputs.version }}." >&2
                      exit 1
                  fi

            - name: Package ${{ matrix.platform }}
              run: |
                  set -euo pipefail
                  release_dir="$PWD/cli/release-artifacts"
                  rm -rf "$release_dir"
                  mkdir -p "$release_dir"

                  package_binary() {
                      local asset_name="$1"
                      local source_path="$2"
                      local output_name="$3"
                      local readme_dir="$4"
                      local workdir
                      workdir="$(mktemp -d)"
                      mkdir -p "$workdir/$asset_name"
                      cp "$readme_dir/README.md" "$workdir/$asset_name/README.md"
                      cp "$readme_dir/README.zh-CN.md" "$workdir/$asset_name/README.zh-CN.md"
                      cp LICENSE NOTICE.md "$workdir/$asset_name/"
                      cp "$source_path" "$workdir/$asset_name/$output_name"

                      if [[ "${{ matrix.archive }}" == "zip" ]]; then
                          (cd "$workdir" && zip -qr "$release_dir/${asset_name}.zip" "$asset_name")
                      else
                          chmod +x "$workdir/$asset_name/$output_name"
                          tar -czf "$release_dir/${asset_name}.tar.gz" -C "$workdir" "$asset_name"
                      fi

                      rm -rf "$workdir"
                  }

                  server_asset="hapi-nexus-${{ needs.prepare.outputs.tag }}-hapi-server-${{ matrix.platform }}"
                  client_asset="hapi-nexus-${{ needs.prepare.outputs.tag }}-hapi-${{ matrix.platform }}"

                  if [[ "${{ matrix.archive }}" == "zip" ]]; then
                      package_binary "$server_asset" "cli/dist-exe/${{ matrix.target }}/hapi-server.exe" "hapi-server.exe" "docs/release/hapi-server"
                      package_binary "$client_asset" "cli/dist-exe/${{ matrix.target }}/hapi.exe" "hapi.exe" "docs/release/hapi-client"
                  else
                      package_binary "$server_asset" "cli/dist-exe/${{ matrix.target }}/hapi-server" "hapi-server" "docs/release/hapi-server"
                      package_binary "$client_asset" "cli/dist-exe/${{ matrix.target }}/hapi" "hapi" "docs/release/hapi-client"
                  fi

                  ls -lh "$release_dir"

            - name: Upload ${{ matrix.platform }} artifact
              uses: actions/upload-artifact@v4
              with:
                  name: hapi-nexus-${{ needs.prepare.outputs.tag }}-${{ matrix.platform }}-release-assets
                  path: cli/release-artifacts/*
                  if-no-files-found: error
                  retention-days: 30

    publish:
        name: Publish GitHub Release
        needs:
            - prepare
            - checks
            - build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        steps:
            - name: Checkout release commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare.outputs.commit }}

            - name: Download release artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: hapi-nexus-${{ needs.prepare.outputs.tag }}-*
                  path: cli/release-artifacts
                  merge-multiple: true

            - name: Generate checksums
              run: |
                  cd cli/release-artifacts
                  sha256sum * > checksums.txt
                  ls -lh

            - name: Verify Homebrew client artifacts
              run: |
                  set -euo pipefail
                  cd cli/release-artifacts
                  tag="${{ needs.prepare.outputs.tag }}"
                  test -f "hapi-nexus-${tag}-hapi-darwin-arm64.tar.gz"
                  test -f "hapi-nexus-${tag}-hapi-darwin-amd64.tar.gz"
                  test -f checksums.txt
                  grep -q "  hapi-nexus-${tag}-hapi-darwin-arm64.tar.gz$" checksums.txt
                  grep -q "  hapi-nexus-${tag}-hapi-darwin-amd64.tar.gz$" checksums.txt

            - name: Upload combined release artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: hapi-nexus-${{ needs.prepare.outputs.tag }}-release-assets
                  path: cli/release-artifacts/*
                  if-no-files-found: error
                  retention-days: 30

            - name: Publish GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
              run: |
                  set -euo pipefail
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      gh release upload "$RELEASE_TAG" cli/release-artifacts/* --clobber
                  else
                      gh release create "$RELEASE_TAG" \
                          --title "Release $RELEASE_TAG" \
                          --generate-notes \
                          --verify-tag \
                          cli/release-artifacts/*
                  fi

            - name: Setup Bun
              if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
              run: bun install --frozen-lockfile

            - name: Update Homebrew formula
              if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
                  HOMEBREW_TAP_REPO: https://github.com/jacobs-256/homebrew-hapi-nexus.git
              run: |
                  cd cli && bun run update-homebrew-formula --version "${{ needs.prepare.outputs.version }}" --release-tag "${{ needs.prepare.outputs.tag }}" --push
