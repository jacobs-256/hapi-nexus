name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing release tag, for example v0.25.2'
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        name: Build and publish release assets
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref_name }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Resolve release metadata
              id: meta
              run: |
                  tag="${{ github.event.inputs.tag || github.ref_name }}"
                  if [[ ! "$tag" =~ ^v[0-9] ]]; then
                      echo "Release tag must start with v and a version number, got: $tag" >&2
                      exit 1
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check committed whitespace
              run: git diff-tree --check --no-commit-id --root -r HEAD

            - name: Typecheck
              run: bun typecheck

            - name: Create integration test env
              run: |
                  {
                      echo "HAPI_HOME=~/.hapi-dev-test"
                      echo "HAPI_API_URL=http://localhost:3006"
                      echo "CLI_API_TOKEN=${CLI_API_TOKEN:-dev-test-token}"
                      echo "HAPI_DAEMON_HTTP_TIMEOUT=60000"
                      echo "HAPI_DAEMON_HEARTBEAT_INTERVAL=30000"
                  } > cli/.env.integration-test

            - name: Test
              run: bun run test

            - name: Build web assets
              run: |
                  bun run download:tunwg
                  bun run build:web
                  cd hub && bun run generate:embedded-web-assets

            - name: Build release executables
              run: |
                  set -euo pipefail
                  targets=(
                      "bun-darwin-arm64"
                      "bun-linux-arm64"
                      "bun-linux-x64-baseline"
                      "bun-windows-x64"
                  )
                  for target in "${targets[@]}"; do
                      (cd cli && bun run scripts/build-executable.ts --server-and-client --target "$target")
                  done

            - name: Package release artifacts
              run: |
                  set -euo pipefail
                  release_dir="$PWD/cli/release-artifacts"
                  rm -rf "$release_dir"
                  mkdir -p "$release_dir"

                  package_unix() {
                      local target="$1"
                      local platform="$2"
                      local workdir
                      workdir="$(mktemp -d)"
                      mkdir -p "$workdir/hapi-nexus"
                      cp "cli/dist-exe/$target/hapi-server" "$workdir/hapi-nexus/hapi-server"
                      cp "cli/dist-exe/$target/hapi" "$workdir/hapi-nexus/hapi"
                      cp README.md README.zh-CN.md LICENSE NOTICE.md "$workdir/hapi-nexus/"
                      chmod +x "$workdir/hapi-nexus/hapi-server" "$workdir/hapi-nexus/hapi"
                      tar -czf "$release_dir/hapi-nexus-${{ steps.meta.outputs.tag }}-${platform}.tar.gz" -C "$workdir" hapi-nexus
                      rm -rf "$workdir"
                  }

                  package_windows() {
                      local target="$1"
                      local platform="$2"
                      local workdir
                      workdir="$(mktemp -d)"
                      mkdir -p "$workdir/hapi-nexus"
                      cp "cli/dist-exe/$target/hapi-server.exe" "$workdir/hapi-nexus/hapi-server.exe"
                      cp "cli/dist-exe/$target/hapi.exe" "$workdir/hapi-nexus/hapi.exe"
                      cp README.md README.zh-CN.md LICENSE NOTICE.md "$workdir/hapi-nexus/"
                      (cd "$workdir" && zip -qr "$release_dir/hapi-nexus-${{ steps.meta.outputs.tag }}-${platform}.zip" hapi-nexus)
                      rm -rf "$workdir"
                  }

                  package_unix "bun-darwin-arm64" "darwin-arm64"
                  package_unix "bun-linux-arm64" "linux-arm64"
                  package_unix "bun-linux-x64-baseline" "linux-amd64"
                  package_windows "bun-windows-x64" "windows-amd64"

                  cd "$release_dir"
                  sha256sum * > checksums.txt
                  ls -lh

            - name: Upload workflow artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: hapi-nexus-${{ steps.meta.outputs.tag }}-release-assets
                  path: cli/release-artifacts/*
                  if-no-files-found: error
                  retention-days: 30

            - name: Publish GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ steps.meta.outputs.tag }}
              run: |
                  set -euo pipefail
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      gh release upload "$RELEASE_TAG" cli/release-artifacts/* --clobber
                  else
                      gh release create "$RELEASE_TAG" \
                          --title "Release $RELEASE_TAG" \
                          --generate-notes \
                          cli/release-artifacts/*
                  fi

            - name: Update Homebrew formula
              if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
              run: |
                  cd cli && bun run update-homebrew-formula --version "${{ steps.meta.outputs.version }}" --push
